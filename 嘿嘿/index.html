<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>嘿嘿</title>
  <style>
    :root {
      --parchment-bg: rgba(255, 250, 240, 0.86);
      --parchment-hover: rgba(255, 253, 248, 0.96);
      --ink-main: #4A3222;
      --ink-soft: #7D5D47;
      --ink-border: rgba(110, 75, 50, 0.22);
      --accent-amber: #D9793B;
      --accent-gold: #F5B82E;
      --serif: "Noto Serif SC", "Source Han Serif SC", "Songti SC", "STSong", "Georgia", serif;
      --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: var(--sans);
      background: linear-gradient(180deg, #FFFDF5 0%, #FCE8C5 65%, #F4D3A2 100%);
      color: var(--ink-main);
      touch-action: none;
    }

    #canvas-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      cursor: grab;
    }

    #canvas-container:active {
      cursor: grabbing;
    }

    /* Subtle Watercolor Paper Grain Overlay */
    #paper-overlay {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      opacity: 0.22;
      mix-blend-mode: multiply;
    }

    /* Soft Storybook Vignette Frame */
    .storybook-frame {
      position: fixed;
      inset: 12px;
      border: 1.5px solid rgba(110, 75, 50, 0.16);
      border-radius: 22px;
      z-index: 5;
      pointer-events: none;
      box-shadow: inset 0 0 55px rgba(255, 235, 195, 0.3);
    }

    /* Header Title */
    #header-title {
      position: fixed;
      top: 22px;
      left: 26px;
      z-index: 20;
      pointer-events: none;
      background: var(--parchment-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 12px 20px;
      border-radius: 18px;
      border: 1px solid var(--ink-border);
      box-shadow: 0 10px 28px rgba(90, 55, 30, 0.08), inset 0 1px 0 rgba(255, 255, 255, 0.9);
    }

    #header-title .zh {
      font-family: var(--serif);
      font-size: clamp(1.1rem, 1.8vw, 1.42rem);
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--ink-main);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #header-title .en {
      font-family: var(--serif);
      font-style: italic;
      font-size: 0.75rem;
      letter-spacing: 0.06em;
      color: var(--ink-soft);
      margin-top: 3px;
    }

    #header-title .rule {
      width: 60px;
      height: 2px;
      background: linear-gradient(90deg, var(--accent-amber), transparent);
      margin-top: 7px;
      border-radius: 2px;
    }

    /* Top-Right Action Bar */
    #top-actions {
      position: fixed;
      top: 22px;
      right: 26px;
      z-index: 30;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: flex-end;
      max-width: 62vw;
    }

    .ghibli-btn {
      font-family: var(--serif);
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: var(--ink-main);
      background: var(--parchment-bg);
      border: 1px solid var(--ink-border);
      border-radius: 999px;
      padding: 8px 15px;
      cursor: pointer;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 6px 16px rgba(90, 55, 30, 0.08), inset 0 1px 0 rgba(255, 255, 255, 0.85);
      transition: all 0.22s cubic-bezier(0.2, 0.8, 0.2, 1);
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .ghibli-btn:hover {
      background: var(--parchment-hover);
      transform: translateY(-2px);
      border-color: rgba(217, 121, 59, 0.5);
      box-shadow: 0 10px 22px rgba(90, 55, 30, 0.13);
    }

    .ghibli-btn:active {
      transform: translateY(0);
    }

    .ghibli-btn.primary {
      background: linear-gradient(135deg, #E88846 0%, #D16828 100%);
      color: #FFFDF9;
      border-color: rgba(255, 255, 255, 0.35);
      box-shadow: 0 8px 20px rgba(209, 104, 40, 0.28);
    }

    .ghibli-btn.primary:hover {
      background: linear-gradient(135deg, #F09352 0%, #DC7130 100%);
      box-shadow: 0 10px 24px rgba(209, 104, 40, 0.38);
    }

    /* Left Cake & Camera Control Panel */
    #inspector-panel {
      position: fixed;
      top: 118px;
      left: 26px;
      z-index: 25;
      width: 284px;
      padding: 16px 18px;
      border-radius: 20px;
      background: var(--parchment-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--ink-border);
      box-shadow: 0 14px 34px rgba(90, 55, 30, 0.1), inset 0 1px 0 rgba(255, 255, 255, 0.9);
      max-height: calc(100vh - 180px);
      overflow-y: auto;
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .panel-title {
      font-family: var(--serif);
      font-size: 1rem;
      font-weight: 700;
      color: var(--ink-main);
    }

    .badge {
      font-size: 0.68rem;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 999px;
      background: rgba(217, 121, 59, 0.16);
      color: #B85A22;
      letter-spacing: 0.04em;
    }

    .panel-desc {
      font-size: 0.74rem;
      line-height: 1.45;
      color: var(--ink-soft);
      margin-bottom: 10px;
    }

    .section-label {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--ink-soft);
      margin: 10px 0 6px;
    }

    .cam-preset-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-bottom: 8px;
    }

    .preset-btn {
      padding: 7px 6px;
      border-radius: 10px;
      border: 1px solid rgba(110, 75, 50, 0.18);
      background: rgba(255, 255, 255, 0.7);
      color: var(--ink-main);
      font-size: 0.73rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: all 0.18s ease;
    }

    .preset-btn:hover {
      background: #FFF;
      border-color: var(--accent-amber);
      transform: translateY(-1px);
    }

    /* Bag Opacity Slider Control */
    .slider-card {
      padding: 9px 12px;
      border-radius: 11px;
      border: 1px solid rgba(110, 75, 50, 0.15);
      background: rgba(255, 255, 255, 0.65);
      margin-bottom: 8px;
    }

    .slider-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--ink-main);
      margin-bottom: 6px;
    }

    .slider-val {
      font-family: var(--serif);
      font-size: 0.76rem;
      font-weight: 700;
      color: #B85A22;
    }

    .ghibli-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 6px;
      border-radius: 999px;
      background: linear-gradient(90deg, rgba(217, 121, 59, 0.25), rgba(217, 121, 59, 0.75));
      outline: none;
      cursor: pointer;
    }

    .ghibli-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #D9793B;
      border: 2px solid #FFFDF9;
      box-shadow: 0 2px 6px rgba(74, 40, 24, 0.3);
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    .ghibli-slider::-webkit-slider-thumb:hover {
      transform: scale(1.15);
    }

    .control-list {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .control-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 8px 12px;
      border-radius: 11px;
      border: 1px solid rgba(110, 75, 50, 0.15);
      background: rgba(255, 255, 255, 0.65);
      color: var(--ink-main);
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .control-btn:hover {
      background: rgba(255, 255, 255, 0.95);
      transform: translateY(-1px);
    }

    .control-btn.active {
      background: var(--ink-main);
      color: #FFF8EC;
      border-color: var(--ink-main);
    }

    .indicator {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(110, 75, 50, 0.25);
      transition: all 0.2s ease;
    }

    .control-btn.active .indicator {
      background: #F5B82E;
      box-shadow: 0 0 8px #F5B82E;
    }

    /* Hover Tooltip for Cake in Bag */
    #bag-tooltip {
      position: fixed;
      z-index: 35;
      pointer-events: none;
      padding: 8px 15px;
      border-radius: 999px;
      background: rgba(255, 250, 240, 0.95);
      border: 1px solid rgba(217, 121, 59, 0.5);
      color: var(--ink-main);
      font-family: var(--serif);
      font-size: 0.82rem;
      font-weight: 600;
      box-shadow: 0 8px 24px rgba(90, 55, 30, 0.15);
      opacity: 0;
      transform: translate(-50%, -130%) scale(0.92);
      transition: opacity 0.2s ease, transform 0.2s ease;
      white-space: nowrap;
    }

    #bag-tooltip.visible {
      opacity: 1;
      transform: translate(-50%, -145%) scale(1);
    }

    /* Storybook Bilingual Subtitle (Cat Reveal) */
    #storybook-caption {
      position: fixed;
      left: 50%;
      bottom: 78px;
      transform: translate(-50%, 16px) scale(0.96);
      z-index: 30;
      text-align: center;
      background: rgba(255, 250, 240, 0.9);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      padding: 14px 34px;
      border-radius: 22px;
      border: 1px solid rgba(110, 75, 50, 0.25);
      box-shadow: 0 14px 38px rgba(74, 40, 24, 0.15);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.6s cubic-bezier(0.2, 0.8, 0.2, 1), transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    #storybook-caption.show {
      opacity: 1;
      transform: translate(-50%, 0) scale(1);
    }

    #cap-main {
      font-family: var(--serif);
      font-size: clamp(1.3rem, 2.3vw, 1.9rem);
      font-weight: 700;
      letter-spacing: 0.14em;
      color: #3B2313;
    }

    #cap-rule {
      width: 85px;
      height: 1.5px;
      margin: 7px auto;
      background: linear-gradient(90deg, transparent, var(--accent-amber), transparent);
    }

    #cap-sub {
      font-family: "Georgia", serif;
      font-style: italic;
      font-size: clamp(0.85rem, 1.2vw, 1.02rem);
      letter-spacing: 0.05em;
      color: var(--ink-soft);
    }

    /* Bottom Guide Pill */
    #guide-bar {
      position: fixed;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      padding: 8px 20px;
      border-radius: 999px;
      background: var(--parchment-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--ink-border);
      font-size: 0.78rem;
      color: var(--ink-soft);
      box-shadow: 0 6px 20px rgba(74, 40, 24, 0.08);
      pointer-events: none;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .guide-dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent-amber);
      margin-right: 5px;
      animation: softPulse 2.4s ease-in-out infinite;
    }

    @keyframes softPulse {
      0%, 100% { opacity: 0.45; transform: scale(0.85); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    /* Floating Musical Notes / Hearts Overlay */
    #notes-layer {
      position: fixed;
      inset: 0;
      z-index: 28;
      pointer-events: none;
      overflow: hidden;
    }

    .floating-note {
      position: absolute;
      font-family: var(--serif);
      font-size: 1.55rem;
      font-weight: bold;
      color: #D96B27;
      text-shadow: 0 2px 8px rgba(255, 250, 240, 0.95);
      pointer-events: none;
      animation: floatUpNote 2.4s cubic-bezier(0.2, 0.8, 0.3, 1) forwards;
    }

    @keyframes floatUpNote {
      0% {
        opacity: 0;
        transform: translate(-50%, 0) scale(0.5) rotate(-12deg);
      }
      20% {
        opacity: 1;
        transform: translate(-50%, -22px) scale(1.12) rotate(8deg);
      }
      100% {
        opacity: 0;
        transform: translate(calc(-50% + var(--dx, 20px)), -115px) scale(0.85) rotate(-8deg);
      }
    }

    @media (max-width: 768px) {
      #header-title {
        top: 14px;
        left: 14px;
        padding: 9px 14px;
      }
      #top-actions {
        top: 14px;
        right: 14px;
      }
      #inspector-panel {
        top: auto;
        bottom: 64px;
        left: 14px;
        right: 14px;
        width: auto;
        max-height: 42vh;
      }
      .control-list {
        display: grid;
        grid-template-columns: 1fr 1fr;
      }
      #guide-bar {
        font-size: 0.7rem;
        padding: 6px 12px;
        bottom: 14px;
      }
    }
  </style>

  <!-- Three.js v0.160.0 via ES Module ImportMap -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <style id="fixed-params">
    /* 界面元素全部隐藏：只保留 3D 场景、悬停提示与剧情字幕 */
    #header-title,
    #top-actions,
    #inspector-panel,
    #guide-bar,
    #btn-upload-asset,
    #asset-file-input {
      display: none !important;
    }

    /* 手机竖屏访问：整屏顺时针旋转 90° 横屏展示 */
    @media (orientation: portrait) and (pointer: coarse) {
      #rotate-stage {
        position: fixed;
        left: 0;
        top: 0;
        width: 100vh;
        height: 100vw;
        transform: translateX(100vw) rotate(90deg);
        transform-origin: 0 0;
      }
    }
  </style>
</head>
<body>
<div id="rotate-stage">
  <div id="canvas-container"></div>
  <canvas id="paper-overlay"></canvas>
  <div class="storybook-frame"></div>
  <div id="notes-layer"></div>

  <!-- Ghibli Storybook Header -->
  <header id="header-title">
    <div class="zh">🍂 「秋日 · 纸袋」</div>
    <div class="en">Whispers of the Autumn Bakery</div>
    <div class="rule"></div>
  </header>

  <!-- Top-Right Interactive State Triggers -->
  <nav id="top-actions">
    <button id="btn-action-cake" class="ghibli-btn primary">🍰 取出蛋糕 (Take Out Cake)</button>
    <button id="btn-summon-cat" class="ghibli-btn">🐾 呼唤小猫 (Summon Cat)</button>
    <button id="btn-sound" class="ghibli-btn">🔊 音乐与音效</button>
    <button id="btn-upload-asset" class="ghibli-btn" title="如本地未自动读取原图，可点此选择原图或音频">📂 选择小猫原图/BGM</button>
    <input type="file" id="asset-file-input" accept="image/*,audio/*" multiple style="display:none" />
  </nav>

  <!-- Left Cake & Camera Inspector Panel -->
  <aside id="inspector-panel">
    <div class="panel-header">
      <div class="panel-title">Chiikawa 提拉米苏</div>
      <span class="badge" id="state-badge">纸袋视角 · 3/4</span>
    </div>
    <p class="panel-desc">
      鼠标左键拖动可随时360°自由旋转视角，滚轮缩放，右键平移。
    </p>

    <div class="section-label">🎥 快捷视角 (Camera Angles)</div>
    <div class="cam-preset-row">
      <button id="cam-default" class="preset-btn">👜 纸袋视角</button>
      <button id="cam-top" class="preset-btn">👀 袋口俯视</button>
      <button id="cam-cake" class="preset-btn">🍰 蛋糕特写</button>
    </div>

    <div class="section-label">👜 纸袋透明度 (Bag Opacity)</div>
    <div class="slider-card">
      <div class="slider-header">
        <span>纸袋不透明度</span>
        <span id="bag-opacity-val" class="slider-val">75%</span>
      </div>
      <input type="range" id="bag-opacity-slider" class="ghibli-slider" min="0" max="100" value="75" />
    </div>

    <div class="section-label">🍰 蛋糕与场景控制 (Controls)</div>
    <div class="control-list">
      <button id="btn-rotate" class="control-btn">
        <span>自动旋转 (Auto Rotate)</span>
        <span class="indicator"></span>
      </button>
      <button id="btn-box" class="control-btn active">
        <span>透明包装盒 (Clear Box)</span>
        <span class="indicator"></span>
      </button>
      <button id="btn-explode" class="control-btn">
        <span>分层拆解展示 (Explode)</span>
        <span class="indicator"></span>
      </button>
      <button id="btn-bag-prop" class="control-btn active">
        <span>垫纸与叉勺 (Card & Spork)</span>
        <span class="indicator"></span>
      </button>
      <button id="btn-put-back" class="control-btn">
        <span>↺ 收回纸袋 (Put Back)</span>
        <span class="indicator"></span>
      </button>
    </div>
  </aside>

  <!-- Hover Tooltip -->
  <div id="bag-tooltip">点击纸袋或蛋糕，请它出来 ✨ (Click to take out cake)</div>

  <!-- Stage 4 Cat Revealed Storybook Subtitle -->
  <div id="storybook-caption">
    <div id="cap-main">「我饿了。」</div>
    <div id="cap-rule"></div>
    <div id="cap-sub">"...and I brought a fork."</div>
  </div>

  <!-- Bottom Context Hint Bar -->
  <div id="guide-bar">
    <span id="guide-text"><span class="guide-dot"></span>左键拖动：自由旋转视角 &nbsp;•&nbsp; 点击纸袋或蛋糕将它取出 ✨</span>
  </div>

  <!-- Preserved BGM Audio Element -->
  <audio id="bgm" preload="auto" loop></audio>

  </div><!-- /#rotate-stage -->

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

    // ============================================================================
    // 0. ORIGINAL KITTEN IMAGE & BGM LOADER
    //    Automatically loads your original image without unauthorized redraws!
    // ============================================================================
    const CANDIDATE_CAT_IMAGES = [
      "IMG_20261016_124837_2.jpg",
      "IMG_20261016_124837.jpg",
      "./IMG_20261016_124837_2.jpg",

    // 1. SWEET REALISTIC KITTEN VOICE & GHIBLI SOUND ENGINE

    class GhibliSoundEngine {
      constructor() {
        this.ctx = null;
        this.muted = false;
        this.bgmPlaying = false;
        this.bgmTimer = null;
        this.usingHtmlAudio = false;
      }

      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      playRustleAndLaunch() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;

        // 1. Crisp Kraft Paper Rustle
        const bufferSize = Math.floor(this.ctx.sampleRate * 0.34);
        const noiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const output = noiseBuffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          output[i] = (Math.random() * 2 - 1) * Math.sin((i / bufferSize) * Math.PI);
        }
        const whiteNoise = this.ctx.createBufferSource();
        whiteNoise.buffer = noiseBuffer;

        const filter = this.ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(1300, now);
        filter.frequency.exponentialRampToValueAtTime(2500, now + 0.32);
        filter.Q.value = 1.6;

        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(0.01, now);
        gain.gain.linearRampToValueAtTime(0.20, now + 0.05);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.34);

        whiteNoise.connect(filter).connect(gain).connect(this.ctx.destination);
        whiteNoise.start(now);

        // 2. Soft Wind-Chime Sparkle
        const chimeNotes = [587.33, 740.0, 880.0, 1174.66];
        chimeNotes.forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const cGain = this.ctx.createGain();
          osc.type = 'sine';
          const start = now + 0.04 + idx * 0.065;
          osc.frequency.setValueAtTime(freq, start);
          cGain.gain.setValueAtTime(0.001, start);
          cGain.gain.linearRampToValueAtTime(0.065, start + 0.02);
          cGain.gain.exponentialRampToValueAtTime(0.0008, start + 0.55);
          osc.connect(cGain).connect(this.ctx.destination);
          osc.start(start);
          osc.stop(start + 0.6);
        });
      }

      playLandingThud() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;

        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(140, now);
        osc.frequency.exponentialRampToValueAtTime(48, now + 0.16);

        gain.gain.setValueAtTime(0.28, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);

        osc.connect(gain).connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.22);
      }

      /**
       * Synthesizes a genuinely sweet, soft, high-pitched baby kitten "Mew~ (喵呜~)"
       * using pure sine + soft 2nd harmonic, natural vibrato, and a gentle breathy onset.
       */
      playCuteMeow() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;

        const playSingleKittenMew = (startTime, dur, fStart, fPeak, fEnd, vol) => {
          const fund = this.ctx.createOscillator();
          const harm = this.ctx.createOscillator();
          fund.type = 'sine';
          harm.type = 'triangle';

          fund.frequency.setValueAtTime(fStart, startTime);
          fund.frequency.exponentialRampToValueAtTime(fPeak, startTime + dur * 0.28);
          fund.frequency.exponentialRampToValueAtTime(fPeak * 0.92, startTime + dur * 0.62);
          fund.frequency.exponentialRampToValueAtTime(fEnd, startTime + dur);

          harm.frequency.setValueAtTime(fStart * 2, startTime);
          harm.frequency.exponentialRampToValueAtTime(fPeak * 2, startTime + dur * 0.28);
          harm.frequency.exponentialRampToValueAtTime(fPeak * 1.84, startTime + dur * 0.62);
          harm.frequency.exponentialRampToValueAtTime(fEnd * 2, startTime + dur);

          const vib = this.ctx.createOscillator();
          const vibGain = this.ctx.createGain();
          vib.frequency.value = 6.8;
          vibGain.gain.setValueAtTime(0.1, startTime);
          vibGain.gain.linearRampToValueAtTime(14.0, startTime + dur * 0.5);
          vib.connect(vibGain);
          vibGain.connect(fund.frequency);

          const mouthFilter = this.ctx.createBiquadFilter();
          mouthFilter.type = 'lowpass';
          mouthFilter.Q.value = 2.4;
          mouthFilter.frequency.setValueAtTime(1400, startTime);
          mouthFilter.frequency.exponentialRampToValueAtTime(2900, startTime + dur * 0.3);
          mouthFilter.frequency.exponentialRampToValueAtTime(1500, startTime + dur);

          const fundGain = this.ctx.createGain();
          const harmGain = this.ctx.createGain();
          fundGain.gain.value = 1.0;
          harmGain.gain.value = 0.22;

          const masterEnv = this.ctx.createGain();
          masterEnv.gain.setValueAtTime(0.0001, startTime);
          masterEnv.gain.linearRampToValueAtTime(vol, startTime + dur * 0.14);
          masterEnv.gain.setValueAtTime(vol * 0.9, startTime + dur * 0.55);
          masterEnv.gain.exponentialRampToValueAtTime(0.0001, startTime + dur);

          const airLen = Math.floor(this.ctx.sampleRate * 0.06);
          const airBuf = this.ctx.createBuffer(1, airLen, this.ctx.sampleRate);
          const airData = airBuf.getChannelData(0);
          for (let i = 0; i < airLen; i++) {
            airData[i] = (Math.random() * 2 - 1) * (1 - i / airLen) * 0.08;
          }
          const airSrc = this.ctx.createBufferSource();
          airSrc.buffer = airBuf;
          airSrc.connect(mouthFilter);

          fund.connect(fundGain).connect(mouthFilter);
          harm.connect(harmGain).connect(mouthFilter);
          mouthFilter.connect(masterEnv).connect(this.ctx.destination);

          airSrc.start(startTime);
          fund.start(startTime);
          harm.start(startTime);
          vib.start(startTime);

          fund.stop(startTime + dur + 0.02);
          harm.stop(startTime + dur + 0.02);
          vib.stop(startTime + dur + 0.02);
        };

        playSingleKittenMew(now, 0.48, 860, 1240, 780, 0.26);
        playSingleKittenMew(now + 0.54, 0.28, 980, 1340, 920, 0.18);
      }

          const gain = this.ctx.createGain();

          osc.frequency.setValueAtTime(m.n, now);
          gain.gain.setValueAtTime(0.001, now);
          gain.gain.linearRampToValueAtTime(0.06, now + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.0008, now + m.d * 1.4);
          osc.connect(gain).connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + m.d * 1.45);

          const bOsc = this.ctx.createOscillator();
          const bGain = this.ctx.createGain();
          bOsc.type = 'triangle';
          bOsc.frequency.setValueAtTime(b, now);
          bGain.gain.setValueAtTime(0.001, now);
          bGain.gain.linearRampToValueAtTime(0.032, now + 0.03);
          bGain.gain.exponentialRampToValueAtTime(0.0008, now + 0.6);
          bOsc.connect(bGain).connect(this.ctx.destination);
          bOsc.start(now);
          bOsc.stop(now + 0.65);

          step++;
          this.bgmTimer = setTimeout(playTick, 460);
        };
        playTick();
      }

      toggleMute() {
        this.muted = !this.muted;
        if (this.muted) {
          if (bgmAudioEl) bgmAudioEl.pause();
          if (this.bgmTimer) clearTimeout(this.bgmTimer);
        } else if (this.bgmPlaying) {
          if (this.usingHtmlAudio && bgmAudioEl) {
            bgmAudioEl.play().catch(() => {});
          } else {
            this.startProceduralGhibliWaltz();
          }
        }
        return this.muted;
      }
    }

      const skyMat = new THREE.ShaderMaterial({
        side: THREE.BackSide,
        depthWrite: false,
        uniforms: {
          topColor: { value: new THREE.Color('#FFFDF5') },
          midColor: { value: new THREE.Color('#FCE8C5') },
          bottomColor: { value: new THREE.Color('#F2C68E') },
          sunDir: { value: new THREE.Vector3(0.45, 0.65, 0.5).normalize() }
        },
        vertexShader: `
          varying vec3 vWorldPos;
          void main() {
            vec4 wp = modelMatrix * vec4(position, 1.0);
            vWorldPos = wp.xyz;
            gl_Position = projectionMatrix * viewMatrix * wp;
          }
        `,
        fragmentShader: `
          uniform vec3 topColor;
          uniform vec3 midColor;
          uniform vec3 bottomColor;
          uniform vec3 sunDir;
          varying vec3 vWorldPos;
          void main() {
            vec3 dir = normalize(vWorldPos);
            float h = clamp(dir.y, 0.0, 1.0);
            vec3 col = mix(bottomColor, midColor, smoothstep(0.0, 0.26, h));
            col = mix(col, topColor, smoothstep(0.26, 0.85, h));
            float sunAmt = max(dot(dir, sunDir), 0.0);
            col += vec3(1.0, 0.95, 0.78) * pow(sunAmt, 12.0) * 0.35;
            gl_FragColor = vec4(col, 1.0);
          }
        `
      });

    // Exact Rounded-Square Geometry Engine (from dg.html)
    function getRoundedSquarePoint(u, size, radius) {
      if (size <= 0.0001) return [0, 0];
      const half = size * 0.5;
      const r = Math.max(0.0001, Math.min(radius, half - 0.0001));
      const inner = half - r;

      const straightLen = 2 * inner;
      const arcLen = 0.5 * Math.PI * r;
      const quadLen = straightLen + arcLen;
      const totalPerimeter = 4 * quadLen;

      const normU = ((u % 1) + 1) % 1;
      let dist = normU * totalPerimeter;

      const halfStraight = inner;
      const qIndex = Math.min(3, Math.floor(dist / quadLen));
      const local = dist - qIndex * quadLen;

      let x = 0;
      let z = 0;

      if (local < halfStraight) {
        const t = local;
        if (qIndex === 0) { x = half; z = t; }
        else if (qIndex === 1) { x = -t; z = half; }
        else if (qIndex === 2) { x = -half; z = -t; }
        else { x = t; z = -half; }
      } else if (local < halfStraight + arcLen) {
        const arcFrac = (local - halfStraight) / arcLen;
        const theta = (qIndex + arcFrac) * (Math.PI * 0.5);
        const cx = (qIndex === 0 || qIndex === 3) ? inner : -inner;
        const cz = (qIndex === 0 || qIndex === 1) ? inner : -inner;
        x = cx + Math.cos(theta) * r;
        z = cz + Math.sin(theta) * r;
      } else {
        const t = local - (halfStraight + arcLen);
        if (qIndex === 0) { x = inner - t; z = half; }
        else if (qIndex === 1) { x = -half; z = inner - t; }
        else if (qIndex === 2) { x = -inner + t; z = -half; }
        else { x = half; z = -inner + t; }
      }

      return [x, z];
    }

    function createRoundedFlaredBoxGeometry(
      bottomSize,
      topSize,
      height,
      bottomRadius,
      topRadius,
      perimeterSegments = 128,
      heightSegments = 10,
      topDome = 0
    ) {
      const geometry = new THREE.BufferGeometry();
      const positions = [];
      const uvs = [];
      const indices = [];

      const ringStride = perimeterSegments + 1;

      for (let iy = 0; iy <= heightSegments; iy++) {
        const v = iy / heightSegments;
        const y = (v - 0.5) * height;
        const curSize = THREE.MathUtils.lerp(bottomSize, topSize, v);
        const curRad = THREE.MathUtils.lerp(bottomRadius, topRadius, v);

        for (let ix = 0; ix <= perimeterSegments; ix++) {
          const u = ix / perimeterSegments;
          const [x, z] = getRoundedSquarePoint(u, curSize, curRad);
          positions.push(x, y, z);
          uvs.push(u * 4, v);
        }
      }

      for (let iy = 0; iy < heightSegments; iy++) {
        for (let ix = 0; ix < perimeterSegments; ix++) {
          const a = iy * ringStride + ix;
          const b = a + 1;
          const c = (iy + 1) * ringStride + ix;
          const d = c + 1;
          indices.push(a, c, b);
          indices.push(b, c, d);
        }
      }

      const capRings = 20;
      const topStartIdx = positions.length / 3;

      for (let ir = 0; ir <= capRings; ir++) {
        const rFrac = ir / capRings;
        for (let ix = 0; ix <= perimeterSegments; ix++) {
          const u = ix / perimeterSegments;
          const [edgeX, edgeZ] = getRoundedSquarePoint(u, topSize, topRadius);
          const x = edgeX * rFrac;
          const z = edgeZ * rFrac;

          const normDistSq = (x * x + z * z) / ((topSize * 0.5) * (topSize * 0.5));
          const domeOffset = topDome * Math.max(0, 1 - normDistSq);
          const y = height * 0.5 + domeOffset;

          positions.push(x, y, z);

          const uvU = 0.5 + (x / topSize);
          const uvV = 0.5 - (z / topSize);
          uvs.push(uvU, uvV);
        }
      }

      for (let ir = 0; ir < capRings; ir++) {
        for (let ix = 0; ix < perimeterSegments; ix++) {
          const a = topStartIdx + ir * ringStride + ix;
          const b = a + 1;
          const c = topStartIdx + (ir + 1) * ringStride + ix;
          const d = c + 1;
          indices.push(a, b, c);
          indices.push(b, d, c);
        }
      }

      const botStartIdx = positions.length / 3;
      positions.push(0, -height * 0.5, 0);
      uvs.push(0.5, 0.5);

      for (let ix = 0; ix <= perimeterSegments; ix++) {
        const u = ix / perimeterSegments;
        const [x, z] = getRoundedSquarePoint(u, bottomSize, bottomRadius);
        positions.push(x, -height * 0.5, z);
        uvs.push(0.5 + x / bottomSize, 0.5 + z / bottomSize);
      }

      for (let ix = 0; ix < perimeterSegments; ix++) {
        indices.push(botStartIdx, botStartIdx + 1 + ix + 1, botStartIdx + 1 + ix);
      }

      geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geometry.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
      geometry.setIndex(indices);
      geometry.computeVertexNormals();
      return geometry;
    }

    // 5. 3D TIRAMISU CAKE & THERMOFORMED BOX (CAKE ON LEFT, FORK/SPORK ON RIGHT!)
    // ============================================================================
    function createThermoformedContainerGeometry() {
      const perimeterSegments = 128;
      const profile = [
        { s: 0.001, r: 0.001, y: 0.08 },
        { s: 8.80,  r: 0.90,  y: 0.08 },
        { s: 8.88,  r: 0.92,  y: 0.25 },
        { s: 9.68,  r: 1.05,  y: 4.75 },
        { s: 9.85,  r: 1.12,  y: 4.96 },
        { s: 10.40, r: 1.25,  y: 4.98 },
        { s: 10.46, r: 1.28,  y: 4.82 },
        { s: 9.96,  r: 1.15,  y: 4.82 },
        { s: 9.82,  r: 1.08,  y: 4.65 },
        { s: 9.02,  r: 0.95,  y: 0.14 },
        { s: 8.86,  r: 0.92,  y: 0.00 },
        { s: 0.001, r: 0.001, y: 0.00 }
      ];

      const positions = [];
      const uvs = [];
      const indices = [];
      const stride = perimeterSegments + 1;

      for (let ip = 0; ip < profile.length; ip++) {
        const pt = profile[ip];
        const v = ip / (profile.length - 1);
        for (let ix = 0; ix <= perimeterSegments; ix++) {
          const u = ix / perimeterSegments;
          const [x, z] = getRoundedSquarePoint(u, pt.s, pt.r);
          positions.push(x, pt.y, z);
          uvs.push(u, v);
        }
      }

      for (let ip = 0; ip < profile.length - 1; ip++) {
        for (let ix = 0; ix < perimeterSegments; ix++) {
          const a = ip * stride + ix;
          const b = a + 1;
          const c = (ip + 1) * stride + ix;
          const d = c + 1;
          indices.push(a, b, c);
          indices.push(b, d, c);
        }
      }

      const geom = new THREE.BufferGeometry();
      geom.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geom.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
      geom.setIndex(indices);
      geom.computeVertexNormals();
      return geom;
    }

    function createCocoaStencilTextures() {
      const size = 1024;
      const colorCanvas = document.createElement('canvas');
      colorCanvas.width = size;
      colorCanvas.height = size;
      const ctx = colorCanvas.getContext('2d');

      const bumpCanvas = document.createElement('canvas');
      bumpCanvas.width = size;
      bumpCanvas.height = size;
      const bCtx = bumpCanvas.getContext('2d');

      const COCOA_DARK = '#3B1E14';
      const COCOA_DEEP = '#29120A';
      const CREAM_WHITE = '#FFF8E7';

      ctx.fillStyle = COCOA_DARK;
      ctx.fillRect(0, 0, size, size);

      bCtx.fillStyle = '#808080';
      bCtx.fillRect(0, 0, size, size);

      function drawCharacterStencil(context) {
        const cx = size * 0.5;
        const cy = size * 0.53;

        context.save();
        context.lineCap = 'round';
        context.lineJoin = 'round';

        const leftEarX = cx - 148;
        const rightEarX = cx + 148;
        const earY = cy - 225;

        context.strokeStyle = CREAM_WHITE;
        context.lineWidth = 22;

        context.beginPath();
        context.arc(leftEarX, earY, 66, Math.PI * 0.85, Math.PI * 2.05);
        context.stroke();

        context.beginPath();
        context.arc(rightEarX, earY, 66, Math.PI * 0.95, Math.PI * 2.15);
        context.stroke();

        context.beginPath();
        context.ellipse(cx, cy + 10, 326, 282, 0, 0, Math.PI * 2);
        context.stroke();

        context.fillStyle = COCOA_DARK;
        context.beginPath();
        context.ellipse(cx, cy + 10, 310, 266, 0, 0, Math.PI * 2);
        context.fill();

        context.beginPath();
        context.arc(leftEarX, earY + 6, 52, 0, Math.PI * 2);
        context.fill();

        context.beginPath();
        context.arc(rightEarX, earY + 6, 52, 0, Math.PI * 2);
        context.fill();

        context.fillStyle = CREAM_WHITE;

        context.beginPath();
        context.ellipse(leftEarX, earY + 10, 44, 48, -0.2, 0, Math.PI * 2);
        context.fill();

        context.beginPath();
        context.ellipse(rightEarX, earY + 10, 44, 48, 0.2, 0, Math.PI * 2);
        context.fill();

        context.beginPath();
        context.ellipse(cx, cy + 14, 284, 242, 0, 0, Math.PI * 2);
        context.fill();

        context.fillStyle = COCOA_DARK;
        context.beginPath();
        context.ellipse(leftEarX + 2, earY + 14, 17, 19, -0.2, 0, Math.PI * 2);
        context.fill();

        context.beginPath();
        context.ellipse(rightEarX - 2, earY + 14, 17, 19, 0.2, 0, Math.PI * 2);
        context.fill();

        context.fillStyle = COCOA_DEEP;
        context.strokeStyle = COCOA_DEEP;

        context.lineWidth = 14;
        context.beginPath();
        context.arc(cx - 98, cy - 64, 40, Math.PI * 1.22, Math.PI * 1.78);
        context.stroke();

        context.beginPath();
        context.arc(cx + 98, cy - 64, 40, Math.PI * 1.22, Math.PI * 1.78);
        context.stroke();

        const eyeOffsetX = 96;
        const eyeY = cy + 2;
        const eyeR = 36;

        [-1, 1].forEach((dir) => {
          const ex = cx + dir * eyeOffsetX;

          context.fillStyle = COCOA_DEEP;
          context.beginPath();
          context.ellipse(ex, eyeY, eyeR, eyeR * 1.06, 0, 0, Math.PI * 2);
          context.fill();

          context.fillStyle = CREAM_WHITE;
          context.beginPath();
          context.ellipse(ex - dir * 6, eyeY - 11, 12.5, 13.5, -0.2, 0, Math.PI * 2);
          context.fill();

          context.beginPath();
          context.arc(ex + dir * 8, eyeY + 13, 6, 0, Math.PI * 2);
          context.fill();

          context.strokeStyle = COCOA_DEEP;
          context.lineWidth = 8.5;
          context.beginPath();
          context.arc(ex, eyeY + 25, 26, Math.PI * 0.2, Math.PI * 0.8);
          context.stroke();
        });

        const noseY = cy + 42;
        context.fillStyle = COCOA_DEEP;
        context.beginPath();
        context.moveTo(cx - 13, noseY - 7);
        context.lineTo(cx + 13, noseY - 7);
        context.lineTo(cx, noseY + 9);
        context.closePath();
        context.fill();

        context.strokeStyle = COCOA_DEEP;
        context.lineWidth = 12.5;
        context.beginPath();
        context.arc(cx - 19, noseY + 17, 19, Math.PI * 0.05, Math.PI * 0.88);
        context.stroke();

        context.beginPath();
        context.arc(cx + 19, noseY + 17, 19, Math.PI * 0.12, Math.PI * 0.95);
        context.stroke();

        context.lineWidth = 8.5;
        context.beginPath();
        context.arc(cx, noseY + 45, 13, Math.PI * 0.25, Math.PI * 0.75);
        context.stroke();

        context.strokeStyle = COCOA_DEEP;
        context.lineWidth = 9.5;
        const blushY = cy + 34;
        for (let i = -1; i <= 1; i++) {
          const lx = cx - 180 + i * 21;
          context.beginPath();
          context.moveTo(lx + 7, blushY - 13);
          context.lineTo(lx - 7, blushY + 13);
          context.stroke();

          const rx = cx + 180 + i * 21;
          context.beginPath();
          context.moveTo(rx + 7, blushY - 13);
          context.lineTo(rx - 7, blushY + 13);
          context.stroke();
        }

        context.restore();
      }

      drawCharacterStencil(ctx);

      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = size;
      tempCanvas.height = size;
      const tCtx = tempCanvas.getContext('2d');
      tCtx.filter = 'blur(2.2px)';
      tCtx.drawImage(colorCanvas, 0, 0);
      ctx.drawImage(tempCanvas, 0, 0);

      const imgData = ctx.getImageData(0, 0, size, size);
      const data = imgData.data;
      const bumpImgData = bCtx.getImageData(0, 0, size, size);
      const bData = bumpImgData.data;

      let seed = 4242;
      function rand() {
        seed = (seed * 16807) % 2147483647;
        return (seed - 1) / 2147483646;
      }

      for (let i = 0; i < data.length; i += 4) {
        const r = data[i];
        const g = data[i + 1];
        const b = data[i + 2];

        const isCream = r > 160;
        const grain = (rand() - 0.5) * (isCream ? 22 : 28);
        const cluster = (Math.sin(i * 0.0017) * Math.cos(i * 0.00073)) * 8;

        data[i]     = Math.max(0, Math.min(255, r + grain + cluster));
        data[i + 1] = Math.max(0, Math.min(255, g + grain + cluster));
        data[i + 2] = Math.max(0, Math.min(255, b + grain + cluster));

        const baseBump = isCream ? 115 : 150;
        const bumpNoise = (rand() - 0.5) * 90 + cluster * 3;
        const hVal = Math.max(0, Math.min(255, baseBump + bumpNoise));
        bData[i] = hVal;
        bData[i + 1] = hVal;
        bData[i + 2] = hVal;
        bData[i + 3] = 255;
      }

      ctx.putImageData(imgData, 0, 0);
      bCtx.putImageData(bumpImgData, 0, 0);

      for (let s = 0; s < 3200; s++) {
        const x = rand() * size;
        const y = rand() * size;
        const rad = 0.6 + rand() * 1.5;
        ctx.fillStyle = rand() > 0.35 ? 'rgba(43, 19, 11, 0.26)' : 'rgba(255, 248, 231, 0.20)';
        ctx.beginPath();
        ctx.arc(x, y, rad, 0, Math.PI * 2);
        ctx.fill();
      }

      const colorTex = new THREE.CanvasTexture(colorCanvas);
      colorTex.colorSpace = THREE.SRGBColorSpace;
      colorTex.anisotropy = renderer.capabilities.getMaxAnisotropy();

      const bumpTex = new THREE.CanvasTexture(bumpCanvas);
      bumpTex.anisotropy = renderer.capabilities.getMaxAnisotropy();

      return { colorTex, bumpTex };
    }

    function createPorousCakeSideTexture(baseHex, poreHex, isSponge = false) {
      const w = 512;
      const h = 128;
      const canvas = document.createElement('canvas');
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = baseHex;
      ctx.fillRect(0, 0, w, h);

      if (isSponge) {
        const grad = ctx.createLinearGradient(0, 0, 0, h);
        grad.addColorStop(0, 'rgba(65, 38, 22, 0.55)');
        grad.addColorStop(0.5, 'rgba(111, 78, 55, 0.15)');
        grad.addColorStop(1, 'rgba(75, 45, 28, 0.45)');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, w, h);
      }

      const count = isSponge ? 2400 : 900;
      for (let i = 0; i < count; i++) {
        const x = Math.random() * w;
        const y = Math.random() * h;
        const r = isSponge ? (0.8 + Math.random() * 2.8) : (0.6 + Math.random() * 1.6);
        ctx.fillStyle = poreHex;
        ctx.globalAlpha = isSponge ? (0.15 + Math.random() * 0.35) : (0.08 + Math.random() * 0.15);
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
      }

      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.ClampToEdgeWrapping;
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    function createSeamlessCuboidBagBody(W, D, H) {
      const group = new THREE.Group();
      const segX = 16;
      const segY = 16;

      function deformBagVertex(x, y, z, flareAmount) {
        const v = y / H;
        const topCurve = Math.pow(v, 1.6);

        const normX = 1.0 - Math.pow(Math.abs(x) / (W * 0.5), 2.0);
        const normZ = 1.0 - Math.pow(Math.abs(z) / (D * 0.5), 2.0);

        const rimExpand = 1.0 + topCurve * (0.04 + flareAmount * 0.08);
        let nx = x * rimExpand;
        let nz = z * rimExpand;

        if (Math.abs(z) > D * 0.49) {
          const signZ = Math.sign(z);
          nz += signZ * normX * topCurve * (0.85 + flareAmount * 2.2);
        }

        if (Math.abs(x) > W * 0.49) {
          const signX = Math.sign(x);
          const creaseProfile = Math.exp(-Math.pow(z / (D * 0.22), 2.0));
          const gussetTuck = -creaseProfile * (1.0 - v * 0.45) * 0.85;
          const gussetFlare = normZ * topCurve * flareAmount * 1.4;
          nx += signX * (gussetTuck + gussetFlare);
        }

        return [nx, y, nz];
      }

      const wallConfigs = [
        // Front wall (+Z): normal points +Z (outward)
        {
          isFrontBack: true,
          evalBase: (u, v) => [(u - 0.5) * W, v * H, D * 0.5]
        },
        // Back wall (-Z): u goes +W/2 to -W/2 so normal points -Z (outward)
        {
          isFrontBack: true,
          evalBase: (u, v) => [(0.5 - u) * W, v * H, -D * 0.5]
        },
        // Left gusset wall (-X)
        {
          isFrontBack: false,
          evalBase: (u, v) => [-W * 0.5, v * H, (u - 0.5) * D]
        },
        // Right gusset wall (+X)
        {
          isFrontBack: false,
          evalBase: (u, v) => [W * 0.5, v * H, (0.5 - u) * D]
        }
      ];

      const deformableWallGeos = [];

      wallConfigs.forEach((cfg) => {
        const geo = new THREE.PlaneGeometry(1, 1, segX, segY);
        const posAttr = geo.attributes.position;
        const uvAttr = geo.attributes.uv;
        const baseCoords = [];

        for (let i = 0; i < posAttr.count; i++) {
          const u = uvAttr.getX(i);
          const v = uvAttr.getY(i);
          const [bx, by, bz] = cfg.evalBase(u, v);
          baseCoords.push(bx, by, bz);
          const [dx, dy, dz] = deformBagVertex(bx, by, bz, 0.15);
          posAttr.setXYZ(i, dx, dy, dz);
        }
        geo.computeVertexNormals();

        if (cfg.isFrontBack) {
          // Outer printed face + Inner clean cream kraft face (prevents mirrored text inside!)
          const outerMesh = new THREE.Mesh(geo, bagOuterFaceMat);
          outerMesh.castShadow = true;
          outerMesh.receiveShadow = true;
          const innerMesh = new THREE.Mesh(geo, bagInnerFaceMat);
          innerMesh.receiveShadow = true;
          group.add(outerMesh, innerMesh);
        } else {
          const sideMesh = new THREE.Mesh(geo, bagSideGussetMat);
          sideMesh.castShadow = true;
          sideMesh.receiveShadow = true;
          group.add(sideMesh);
        }

        deformableWallGeos.push({ geo, baseCoords });
      });

      const floorMesh = new THREE.Mesh(
        new THREE.BoxGeometry(W, 0.18, D),
        bagSideGussetMat
      );
      floorMesh.position.y = 0.09;
      floorMesh.receiveShadow = true;
      floorMesh.castShadow = true;
      group.add(floorMesh);

      group.userData.updateBagFlex = (flareAmount) => {
        deformableWallGeos.forEach(({ geo, baseCoords }) => {
          const posAttr = geo.attributes.position;
          for (let i = 0; i < posAttr.count; i++) {
            const bx = baseCoords[i * 3];
            const by = baseCoords[i * 3 + 1];
            const bz = baseCoords[i * 3 + 2];
            const [dx, dy, dz] = deformBagVertex(bx, by, bz, flareAmount);
            posAttr.setXYZ(i, dx, dy, dz);
          }
          posAttr.needsUpdate = true;
          geo.computeVertexNormals();
        });
      };

      return group;
    }

    const seamlessBagBody = createSeamlessCuboidBagBody(bagW, bagD, bagH);

    // 7. STAGE 4 KITTEN CUTOUT (USES ONLY YOUR ORIGINAL IMAGE + GPU SHADER CUTOUT)
    // ============================================================================
    function createCatCutoutShaderMaterial(texture) {
      return new THREE.ShaderMaterial({
        transparent: true,
        side: THREE.DoubleSide,
        depthWrite: true,
        uniforms: {
          uMap: { value: texture },
          uHasLoaded: { value: texture ? 1.0 : 0.0 }
        },
        vertexShader: `
          varying vec2 vUv;
          void main() {
            vUv = uv;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,
        fragmentShader: `
          uniform sampler2D uMap;
          uniform float uHasLoaded;
          varying vec2 vUv;

          float ellipseDist(vec2 uv, vec2 center, vec2 radii) {
            vec2 d = (uv - center) / radii;
            return length(d);
          }

          void main() {
            if (uHasLoaded < 0.5) discard;
            vec4 texColor = texture2D(uMap, vUv);
            if (texColor.a < 0.08) discard;

            vec3 rgb = texColor.rgb;
            float maxC = max(rgb.r, max(rgb.g, rgb.b));
            float minC = min(rgb.r, min(rgb.g, rgb.b));
            float sat = maxC - minC;
            float lum = (rgb.r + rgb.g + rgb.b) / 3.0;

            float dChest = ellipseDist(vUv, vec2(0.45, 0.24), vec2(0.21, 0.27));
            float dMuzzle = ellipseDist(vUv, vec2(0.47, 0.45), vec2(0.16, 0.14));
            float dRightPaw = ellipseDist(vUv, vec2(0.165, 0.255), vec2(0.088, 0.082));
            float dLeftPaw = ellipseDist(vUv, vec2(0.73, 0.165), vec2(0.085, 0.085));

            bool insideKittenWhiteZone = (dChest < 1.0) || (dMuzzle < 1.0) || (dRightPaw < 1.0) || (dLeftPaw < 1.0);
            bool isCheckerboard = (minC > 0.82) && (sat < 0.055) && (lum > 0.84);

            float alpha = texColor.a;
            if (!insideKittenWhiteZone && isCheckerboard) {
              float bgFactor = smoothstep(0.81, 0.86, minC) * (1.0 - smoothstep(0.035, 0.065, sat));
              alpha *= (1.0 - bgFactor);
            }

            if (alpha < 0.12) discard;
            gl_FragColor = vec4(rgb, alpha);
          }
        `
      });
    }

    function tryFloodFillCutout(img) {
      try {
        const w = img.naturalWidth || img.width;
        const h = img.naturalHeight || img.height;
        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0);

        const imgData = ctx.getImageData(0, 0, w, h);
        const data = imgData.data;
        const visited = new Uint8Array(w * h);

        function isCheckerboard(idx) {
          const r = data[idx];
          const g = data[idx + 1];
          const b = data[idx + 2];
          const a = data[idx + 3];
          if (a < 25) return true;
          const maxC = Math.max(r, g, b);
          const minC = Math.min(r, g, b);
          return minC >= 210 && (maxC - minC) <= 16;
        }

        const queue = new Int32Array(w * h);
        let head = 0;
        let tail = 0;

        function pushSeed(x, y) {
          const p = y * w + x;
          if (!visited[p] && isCheckerboard(p * 4)) {
            visited[p] = 1;
            queue[tail++] = p;
          }
        }

        for (let x = 0; x < w; x++) {
          pushSeed(x, 0);
          pushSeed(x, 1);
        }
        for (let y = 0; y < h; y++) {
          pushSeed(0, y);
          pushSeed(w - 1, y);
        }

        while (head < tail) {
          const p = queue[head++];
          const x = p % w;
          const y = (p - x) / w;
          data[p * 4 + 3] = 0;

          if (x > 0) pushSeed(x - 1, y);
          if (x < w - 1) pushSeed(x + 1, y);
          if (y > 0) pushSeed(x, y - 1);
          if (y < h - 1) pushSeed(x, y + 1);
        }

        ctx.putImageData(imgData, 0, 0);
        const tex = new THREE.CanvasTexture(canvas);
        tex.colorSpace = THREE.SRGBColorSpace;
        return tex;
      } catch (err) {
        const tex = new THREE.Texture(img);
        tex.colorSpace = THREE.SRGBColorSpace;
        tex.needsUpdate = true;
        return tex;
      }
    }

    function loadOriginalKittenImage(urls, index = 0) {
      if (index >= urls.length) {
        fetch('autumn_bag_cinema.html')
          .then((res) => (res.ok ? res.text() : Promise.reject()))
          .then((htmlText) => {
            const match = htmlText.match(/const\s+CAT_DATA_URI\s*=\s*"(data:image\/[^"]+)"/);
            if (match && match[1]) {
              const img = new Image();
              img.onload = () => applyKittenImage(img);
              img.src = match[1];
            }
            const bgmMatch = htmlText.match(/id="bgm"[^>]*src="(data:audio\/[^"]+)"/);
            if (bgmMatch && bgmMatch[1] && (!bgmAudioEl.src || bgmAudioEl.networkState === 3)) {
              bgmAudioEl.src = bgmMatch[1];
            }
          })
          .catch(() => {});
        return;
      }

      const img = new Image();
      if (window.location.protocol !== 'file:') {
        img.crossOrigin = 'anonymous';
      }
      img.onload = () => {
        applyKittenImage(img);
      };
      img.onerror = () => {
        loadOriginalKittenImage(urls, index + 1);
      };
      img.src = urls[index];
    }

    function createLeafTexture(type) {
      const c = document.createElement('canvas');
      c.width = 128;
      c.height = 128;
      const ctx = c.getContext('2d');
      ctx.translate(64, 64);

      if (type === 'ginkgo') {

        ctx.moveTo(0, 35);

        ctx.lineTo(8, -42);
        ctx.bezierCurveTo(55, -35, 45, 10, 0, 35);

        ctx.fillStyle = '#E05A36';
        ctx.beginPath();

        ctx.fill();
      }
      ctx.strokeStyle = 'rgba(120, 55, 20, 0.4)';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(0, -15);
      ctx.lineTo(0, 52);

      const tex = new THREE.CanvasTexture(c);

    }

    });

    const leaves = [];
    const leafGeo = new THREE.PlaneGeometry(1.3, 1.3);
    for (let i = 0; i < 48; i++) {
      const mesh = new THREE.Mesh(leafGeo, i % 2 === 0 ? ginkgoMat : mapleMat);
      mesh.position.set(
        (Math.random() - 0.5) * 46,
        1 + Math.random() * 26,
        (Math.random() - 0.5) * 38
      );
      mesh.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
      scene.add(mesh);
      leaves.push({
        mesh,
        speedY: 1.0 + Math.random() * 1.3,
        swayAmp: 0.8 + Math.random() * 1.4,
        swayFreq: 1.2 + Math.random() * 1.6,
        phase: Math.random() * Math.PI * 2,
        rotSpeed: new THREE.Vector3(
          (Math.random() - 0.5) * 2.0,
          (Math.random() - 0.5) * 2.0,
          (Math.random() - 0.5) * 2.0
        ),
        burstVel: new THREE.Vector3()
      });
    }

    const moteCount = 110;
    const motePositions = new Float32Array(moteCount * 3);
    for (let i = 0; i < moteCount; i++) {
      motePositions[i * 3] = (Math.random() - 0.5) * 38;
      motePositions[i * 3 + 1] = 0.5 + Math.random() * 24;
      motePositions[i * 3 + 2] = (Math.random() - 0.5) * 34;
    }
    const moteGeo = new THREE.BufferGeometry();
    moteGeo.setAttribute('position', new THREE.BufferAttribute(motePositions, 3));
    const moteMat = new THREE.PointsMaterial({
      color: 0xFFF3B8,
      size: 0.3,
      transparent: true,
      opacity: 0.72,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });
    const sunMotes = new THREE.Points(moteGeo, moteMat);
    scene.add(sunMotes);

    // ============================================================================
    // 9. 4-STAGE STATE MACHINE + INITIAL PERSPECTIVE MATCHING `image_6df081.jpg`
    // ============================================================================
    let STATE = 'IN_BAG';
    let flightProgress = 0;
    const flightDuration = 1.28;

    // Centered inside the rectangular cuboid bag (bagHomePos = -4.5, 0.08, -3.5)
    // Because cakeGroup is at CAKE_OFFSET_X (-2.1) and sporkGroup is at SPORK_OFFSET_X (+5.3),
    // centering cakeRootGroup at bagHomePos places the cake on the left and the fork/spork on the right!
    const cakeInBagPos = new THREE.Vector3(-4.5, 0.36, -3.5);
    const cakeOnGroundPos = new THREE.Vector3(landingBoardPos.x + 1.2, 0.56, landingBoardPos.z);
    const flightPeakPos = new THREE.Vector3(1.2, 24.5, 2.5);

    // Camera Presets — DEFAULT_BAG_34 matches `image_6df081.jpg`!
    const camPresets = {
      DEFAULT_BAG_34: {
        // 初始视角 · 已按需求拉远 1.5 倍（原 -19.5, 25.0, 22.8）
        pos: new THREE.Vector3(-28.85, 34.9, 33.6),
        target: new THREE.Vector3(-0.8, 5.2, 1.2)
      },
      TOP_POV: {
        pos: new THREE.Vector3(-4.5, 34.0, 4.5),
        target: new THREE.Vector3(-4.5, 3.5, -3.5)
      },
      CAKE_SHOWCASE: {
        pos: new THREE.Vector3(15.5, 13.5, 26.5),
        target: new THREE.Vector3(landingBoardPos.x, 2.6, landingBoardPos.z)
      },
      CAT_SHOWCASE: {
        pos: new THREE.Vector3(11.5, 12.5, 28.5),
        target: new THREE.Vector3(2.2, 3.2, 8.5)
      }
    };

    let camTransitionActive = false;
    let camTransProgress = 0;
    const camTransStartPos = new THREE.Vector3();
    const camTransStartTarget = new THREE.Vector3();
    const camTransEndPos = new THREE.Vector3();
    const camTransEndTarget = new THREE.Vector3();

    function animateCameraTo(targetPos, lookTarget) {
      camTransStartPos.copy(camera.position);
      camTransStartTarget.copy(controls.target);
      camTransEndPos.copy(targetPos);
      camTransEndTarget.copy(lookTarget);
      camTransProgress = 0;
      camTransitionActive = true;
    }

    controls.addEventListener('start', () => {
      camTransitionActive = false;
    });

    let landingBounceVel = 0;
    let landingBounceOffset = 0;
    let bagRustleTimer = 0;
    let catSpringProgress = 0;
    let isCakeHovered = false;

    // UI Elements
    const btnActionCake = document.getElementById('btn-action-cake');
    const btnSummonCat = document.getElementById('btn-summon-cat');
    const btnSound = document.getElementById('btn-sound');
    const btnRotate = document.getElementById('btn-rotate');
    const btnBox = document.getElementById('btn-box');
    const btnExplode = document.getElementById('btn-explode');
    const btnBagProp = document.getElementById('btn-bag-prop');
    const btnPutBack = document.getElementById('btn-put-back');
    const bagOpacitySlider = document.getElementById('bag-opacity-slider');
    const bagOpacityVal = document.getElementById('bag-opacity-val');
    const stateBadge = document.getElementById('state-badge');
    const bagTooltip = document.getElementById('bag-tooltip');
    const storybookCaption = document.getElementById('storybook-caption');
    const guideText = document.getElementById('guide-text');
    const notesLayer = document.getElementById('notes-layer');

    let isExploded = false;
    let isBoxVisible = true;
    let isBagPropVisible = true;

    // Initialize Scene in Stage 1 with the exact perspective from `image_6df081.jpg`
    cakeRootGroup.position.copy(cakeInBagPos);
    cakeRootGroup.rotation.y = 0.0;
    camera.position.copy(camPresets.DEFAULT_BAG_34.pos);
    controls.target.copy(camPresets.DEFAULT_BAG_34.target);
    controls.update();

    function cubicBezierVec3(p0, p1, p2, t, out) {
      const inv = 1 - t;
      out.x = inv * inv * p0.x + 2 * inv * t * p1.x + t * t * p2.x;
      out.y = inv * inv * p0.y + 2 * inv * t * p1.y + t * t * p2.y;
      out.z = inv * inv * p0.z + 2 * inv * t * p1.z + t * t * p2.z;
    }

    function triggerTakeOutCake() {
      if (STATE !== 'IN_BAG') return;
      STATE = 'FLYING_OUT';
      flightProgress = 0;
      bagRustleTimer = 1.0;
      bagTooltip.classList.remove('visible');
      sound.playRustleAndLaunch();

      animateCameraTo(camPresets.CAKE_SHOWCASE.pos, camPresets.CAKE_SHOWCASE.target);

      stateBadge.textContent = '飞出纸袋 · 跃动中';
      btnActionCake.innerHTML = '↺ 收回纸袋 (Put Back)';
      guideText.innerHTML = '<span class="guide-dot"></span>左键拖动：360°旋转视角 &nbsp;•&nbsp; 滚轮：缩放 &nbsp;•&nbsp; Shift+横滑或点按钮：呼唤小猫 🐾';
    }

    function triggerPutBackCake() {
      if (STATE !== 'ON_GROUND' && STATE !== 'CAT_REVEALED') return;
      if (isExploded) {
        isExploded = false;
        btnExplode.classList.remove('active');
        animatedLayers.forEach((l) => { l.targetY = l.baseY; });
      }
      storybookCaption.classList.remove('show');
      catGroup.visible = false;
      catSpringProgress = 0;

      STATE = 'FLYING_BACK';
      flightProgress = 0;
      bagRustleTimer = 0.85;
      sound.playRustleAndLaunch();

      animateCameraTo(camPresets.DEFAULT_BAG_34.pos, camPresets.DEFAULT_BAG_34.target);

      stateBadge.textContent = '纸袋视角 · 3/4';
      btnActionCake.innerHTML = '🍰 取出蛋糕 (Take Out Cake)';
      guideText.innerHTML = '<span class="guide-dot"></span>左键拖动：自由旋转视角 &nbsp;•&nbsp; 点击纸袋或蛋糕将它取出 ✨';
    }

    function spawnFloatingNotes() {
      const symbols = ['♪', '♫', '✦', '♥', '♪'];
      symbols.forEach((sym, i) => {
        setTimeout(() => {
          const el = document.createElement('div');
          el.className = 'floating-note';
          el.textContent = sym;
          el.style.left = `${42 + (Math.random() - 0.5) * 18}%`;
          el.style.top = `${52 + (Math.random() - 0.5) * 10}%`;
          el.style.setProperty('--dx', `${(Math.random() - 0.5) * 90}px`);
          notesLayer.appendChild(el);
          setTimeout(() => el.remove(), 2400);
        }, i * 180);
      });
    }

    function triggerSummonCat() {
      if (STATE === 'IN_BAG') {
        triggerTakeOutCake();
        setTimeout(() => revealCatNow(), 1350);
        return;
      }
      if (STATE === 'FLYING_OUT' || STATE === 'FLYING_BACK') return;
      revealCatNow();
    }

    function revealCatNow() {
      STATE = 'CAT_REVEALED';
      catGroup.visible = true;
      catSpringProgress = 0.01;
      bagRustleTimer = 1.0;

      animateCameraTo(camPresets.CAT_SHOWCASE.pos, camPresets.CAT_SHOWCASE.target);

      sound.playCuteMeow();
      sound.startBGM();
      spawnFloatingNotes();

      storybookCaption.classList.add('show');
      stateBadge.textContent = '小猫登场 · 喵呜~';
    }

    // ============================================================================
    // 10. POINTER GESTURE HANDLER (HARMONIOUS WITH ORBITCONTROLS)
    // ============================================================================
    const raycaster = new THREE.Raycaster();
    const pointerNDC = new THREE.Vector2();
    let downX = 0;
    let downY = 0;
    let downTime = 0;
    let lastX = 0;
    let lastTime = 0;
    let isDown = false;
    let swipeCooldown = 0;

    function updatePointerNDC(e) {
      const s = stageSize();
      const p = toLocal(e.clientX, e.clientY);
      pointerNDC.x = (p.x / s.w) * 2 - 1;
      pointerNDC.y = -(p.y / s.h) * 2 + 1;
    }

    renderer.domElement.addEventListener('pointerdown', (e) => {
      sound.init();
      isDown = true;
      const p0 = toLocal(e.clientX, e.clientY);
      downX = lastX = p0.x;
      downY = p0.y;
      downTime = lastTime = performance.now();
      updatePointerNDC(e);
    });

    window.addEventListener('pointermove', (e) => {
      updatePointerNDC(e);

      if (!isDown && STATE === 'IN_BAG') {
        raycaster.setFromCamera(pointerNDC, camera);
        const hits = raycaster.intersectObjects([cakeRootGroup, paperBagGroup], true);
        isCakeHovered = hits.length > 0;
        if (isCakeHovered) {
          const pt = toLocal(e.clientX, e.clientY);
          bagTooltip.style.left = `${pt.x}px`;
          bagTooltip.style.top = `${pt.y}px`;
          bagTooltip.classList.add('visible');
        } else {
          bagTooltip.classList.remove('visible');
        }
        return;
      }

      if (!isDown) return;

      const now = performance.now();
      const dtMs = Math.max(1, now - lastTime);
      const pm = toLocal(e.clientX, e.clientY);
      const dx = pm.x - lastX;
      const vx = dx / dtMs;

      const isFastFlick = Math.abs(vx) > 3.2 && Math.abs(pm.x - downX) > 220 && Math.abs(pm.y - downY) < 65;
      const isShiftSwipe = e.shiftKey && Math.abs(pm.x - downX) > 90;

      if ((isFastFlick || isShiftSwipe) && now > swipeCooldown) {
        swipeCooldown = now + 1500;
        triggerSummonCat();
      }

      lastX = pm.x;
      lastTime = now;
    });

    window.addEventListener('pointerup', (e) => {
      if (!isDown) return;
      isDown = false;

      const pu = toLocal(e.clientX, e.clientY);
      const moveDist = Math.hypot(pu.x - downX, pu.y - downY);
      const clickDur = performance.now() - downTime;

      if (moveDist < 6 && clickDur < 350) {
        updatePointerNDC(e);
        raycaster.setFromCamera(pointerNDC, camera);

        if (STATE === 'IN_BAG') {
          const hits = raycaster.intersectObjects([cakeRootGroup, paperBagGroup], true);
          if (hits.length > 0) {
            triggerTakeOutCake();
          }
        } else if (STATE === 'CAT_REVEALED') {
          const catHits = raycaster.intersectObject(catGroup, true);
          if (catHits.length > 0) {
            catSpringProgress = 0.25;
            sound.playCuteMeow();
            spawnFloatingNotes();
          }
        }
      }
    });

    // ============================================================================
    // 11. UI BUTTON, SLIDER & CAMERA PRESET LISTENERS
    // ============================================================================
    bagOpacitySlider.addEventListener('input', (e) => {
      const val = Number(e.target.value);
      bagOpacityVal.textContent = `${val}%`;
      setBagOpacity(val / 100);
    });

    document.getElementById('cam-default').addEventListener('click', () => {
      animateCameraTo(camPresets.DEFAULT_BAG_34.pos, camPresets.DEFAULT_BAG_34.target);
    });
    document.getElementById('cam-top').addEventListener('click', () => {
      animateCameraTo(camPresets.TOP_POV.pos, camPresets.TOP_POV.target);
    });
    document.getElementById('cam-cake').addEventListener('click', () => {
      animateCameraTo(camPresets.CAKE_SHOWCASE.pos, camPresets.CAKE_SHOWCASE.target);
    });

    btnActionCake.addEventListener('click', () => {
      if (STATE === 'IN_BAG') triggerTakeOutCake();
      else triggerPutBackCake();
    });

    btnSummonCat.addEventListener('click', () => {
      triggerSummonCat();
    });

    btnSound.addEventListener('click', () => {
      sound.init();
      if (!sound.bgmPlaying) {
        sound.startBGM();
        btnSound.textContent = '🔊 音乐播放中';
      } else {
        const isMuted = sound.toggleMute();
        btnSound.textContent = isMuted ? '🔇 已静音' : '🔊 音乐播放中';
      }
    });

    btnRotate.addEventListener('click', () => {
      controls.autoRotate = !controls.autoRotate;
      btnRotate.classList.toggle('active', controls.autoRotate);
    });

    btnBox.addEventListener('click', () => {
      isBoxVisible = !isBoxVisible;
      clearBoxMesh.visible = isBoxVisible;
      btnBox.classList.toggle('active', isBoxVisible);
    });

    btnExplode.addEventListener('click', () => {
      if (STATE === 'IN_BAG') triggerTakeOutCake();
      isExploded = !isExploded;
      btnExplode.classList.toggle('active', isExploded);
      animatedLayers.forEach((layer) => {
        layer.targetY = isExploded ? layer.baseY + layer.explodeOffset : layer.baseY;
      });
    });

    btnBagProp.addEventListener('click', () => {
      isBagPropVisible = !isBagPropVisible;
      envPropGroup.visible = isBagPropVisible;
      btnBagProp.classList.toggle('active', isBagPropVisible);
    });

    btnPutBack.addEventListener('click', () => {
      triggerPutBackCake();
    });

    window.addEventListener('resize', () => {
      const s = stageSize();
      camera.aspect = s.w / s.h;
      camera.updateProjectionMatrix();
      renderer.setSize(s.w, s.h);
    });

    // ============================================================================
    // 12. MAIN ANIMATION LOOP
    // ============================================================================
    const clock = new THREE.Clock();

    function easeOutCubic(x) {
      return 1 - Math.pow(1 - x, 3);
    }

    function animate() {
      requestAnimationFrame(animate);

      const dt = Math.min(clock.getDelta(), 0.1);
      const elapsed = clock.getElapsedTime();
      const dampSpeed = 6.5 * dt;

      // 1. Update 5-Layer Tiramisu Exploded View Lerp
      animatedLayers.forEach((layer) => {
        layer.mesh.position.y = THREE.MathUtils.lerp(
          layer.mesh.position.y,
          layer.targetY,
          dampSpeed
        );
      });

      // 2. Seamless Cuboid Paper Bag Breathing & Flexing (Corners stay 100% welded!)
      const idleBreeze = Math.sin(elapsed * 1.6) * 0.04;
      if (bagRustleTimer > 0) {
        bagRustleTimer = Math.max(0, bagRustleTimer - dt * 1.4);
      }
      const rustleFlare = Math.sin(bagRustleTimer * Math.PI * 4) * 0.35 * bagRustleTimer;
      const baseFlare = STATE === 'IN_BAG' ? 0.18 : 0.08;
      seamlessBagBody.userData.updateBagFlex(baseFlare + rustleFlare + idleBreeze);
      paperBagGroup.rotation.z = Math.sin(elapsed * 1.1) * 0.008;

      // 3. State Machine Choreography
      if (STATE === 'IN_BAG') {
        const hoverLift = isCakeHovered ? 0.65 + Math.sin(elapsed * 5.0) * 0.15 : 0;
        cakeRootGroup.position.set(
          cakeInBagPos.x,
          THREE.MathUtils.lerp(cakeRootGroup.position.y, cakeInBagPos.y + hoverLift, 8 * dt),
          cakeInBagPos.z
        );
        cakeRootGroup.rotation.y = THREE.MathUtils.lerp(cakeRootGroup.rotation.y, 0.0, 5 * dt);
        cakeRootGroup.rotation.x = THREE.MathUtils.lerp(cakeRootGroup.rotation.x, 0, 5 * dt);
        cakeRootGroup.rotation.z = THREE.MathUtils.lerp(cakeRootGroup.rotation.z, 0, 5 * dt);
        cakeRootGroup.scale.setScalar(1);
      } else if (STATE === 'FLYING_OUT') {
        flightProgress = Math.min(1, flightProgress + dt / flightDuration);
        const eased = easeOutCubic(flightProgress);

        cubicBezierVec3(cakeInBagPos, flightPeakPos, cakeOnGroundPos, eased, cakeRootGroup.position);
        cakeRootGroup.rotation.y = eased * Math.PI * 2;
        cakeRootGroup.rotation.x = Math.sin(eased * Math.PI) * 0.22;
        cakeRootGroup.rotation.z = Math.sin(eased * Math.PI * 2) * 0.1;

        if (flightProgress >= 1) {
          STATE = 'ON_GROUND';
          stateBadge.textContent = '野餐木垫 · 360°观赏';
          landingBounceVel = -7.0;
          landingBounceOffset = 0;
          sound.playLandingThud();

          leaves.forEach((lf) => {
            const dx = lf.mesh.position.x - cakeOnGroundPos.x;
            const dz = lf.mesh.position.z - cakeOnGroundPos.z;
            const dist = Math.hypot(dx, dz) + 0.1;
            if (dist < 16) {
              lf.burstVel.set((dx / dist) * 8, 3 + Math.random() * 4, (dz / dist) * 8);
            }
          });
        }
      } else if (STATE === 'FLYING_BACK') {
        flightProgress = Math.min(1, flightProgress + dt / 1.1);
        const eased = easeOutCubic(flightProgress);

        cubicBezierVec3(cakeOnGroundPos, flightPeakPos, cakeInBagPos, eased, cakeRootGroup.position);
        cakeRootGroup.rotation.y = (1 - eased) * Math.PI * 2;
        cakeRootGroup.rotation.x = Math.sin(eased * Math.PI) * -0.18;

        if (flightProgress >= 1) {
          STATE = 'IN_BAG';
        }
      } else if (STATE === 'ON_GROUND' || STATE === 'CAT_REVEALED') {
        const stiffness = 140;
        const damping = 12;
        const force = -stiffness * landingBounceOffset - damping * landingBounceVel;
        landingBounceVel += force * dt;
        landingBounceOffset += landingBounceVel * dt;

        cakeRootGroup.position.set(
          cakeOnGroundPos.x,
          cakeOnGroundPos.y + Math.max(-0.2, landingBounceOffset),
          cakeOnGroundPos.z
        );

        const squash = THREE.MathUtils.clamp(1 + landingBounceOffset * 0.11, 0.91, 1.09);
        cakeRootGroup.scale.set(1 / Math.sqrt(squash), squash, 1 / Math.sqrt(squash));
        cakeRootGroup.rotation.x = THREE.MathUtils.lerp(cakeRootGroup.rotation.x, 0, 8 * dt);
        cakeRootGroup.rotation.z = THREE.MathUtils.lerp(cakeRootGroup.rotation.z, 0, 8 * dt);
      }

      // 4. Cat Pop-Out Elastic Spring Animation (Stage 4)
      if (STATE === 'CAT_REVEALED' && catGroup.visible) {
        catSpringProgress = Math.min(1, catSpringProgress + dt * 1.85);
        const p = catSpringProgress;
        const elastic = p === 1 ? 1 : 1 - Math.pow(2, -9 * p) * Math.cos((p * 8.5 - 0.75) * ((2 * Math.PI) / 3));

        catGroup.position.lerpVectors(catStartPos, catTargetPos, Math.min(1.06, elastic));
        catGroup.position.y = catTargetPos.y + Math.sin(p * Math.PI) * 2.8 + Math.abs(Math.sin(elapsed * 3.8)) * 0.18;

        const scaleVal = Math.max(0.01, elastic);
        catGroup.scale.set(
          scaleVal * (1 + Math.sin(elapsed * 4.2) * 0.025),
          scaleVal * (1 - Math.sin(elapsed * 4.2) * 0.025),
          scaleVal
        );

        catGroup.lookAt(camera.position.x, catGroup.position.y + 4.5, camera.position.z);
        catSpriteMesh.rotation.z = Math.sin(elapsed * 3.0) * 0.04;
      }

      // 5. Smooth Camera Preset Transition (if active) + OrbitControls Update
      if (camTransitionActive) {
        camTransProgress = Math.min(1, camTransProgress + dt * 1.5);
        const t = easeOutCubic(camTransProgress);
        camera.position.lerpVectors(camTransStartPos, camTransEndPos, t);
        controls.target.lerpVectors(camTransStartTarget, camTransEndTarget, t);
        if (camTransProgress >= 1) {
          camTransitionActive = false;
        }
      }
      controls.update();

      // 6. Update Fluttering Autumn Leaves & Golden Sun Motes
      leaves.forEach((lf) => {
        lf.mesh.position.y -= lf.speedY * dt;
        lf.mesh.position.x += Math.sin(elapsed * lf.swayFreq + lf.phase) * lf.swayAmp * dt;
        lf.mesh.position.z += Math.cos(elapsed * lf.swayFreq * 0.8 + lf.phase) * lf.swayAmp * 0.6 * dt;

        lf.mesh.position.addScaledVector(lf.burstVel, dt);
        lf.burstVel.multiplyScalar(0.92);

        lf.mesh.rotation.x += lf.rotSpeed.x * dt;
        lf.mesh.rotation.y += lf.rotSpeed.y * dt;
        lf.mesh.rotation.z += lf.rotSpeed.z * dt;

        if (lf.mesh.position.y < 0.15) {
          lf.mesh.position.y = 24 + Math.random() * 6;
          lf.mesh.position.x = (Math.random() - 0.5) * 46;
          lf.mesh.position.z = (Math.random() - 0.5) * 38;
        }
      });

      const posAttr = sunMotes.geometry.attributes.position;
      for (let i = 0; i < moteCount; i++) {
        let y = posAttr.getY(i) + dt * 0.45;
        if (y > 24) y = 0.5;
        posAttr.setY(i, y);
        posAttr.setX(i, posAttr.getX(i) + Math.sin(elapsed + i) * 0.008);
      }
      posAttr.needsUpdate = true;

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
