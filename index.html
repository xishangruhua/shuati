<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>刷题</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{
      width:100%;height:100%;
      background:linear-gradient(160deg,#dcefe2,#e6f1e9);
      background-attachment:fixed;
      font-family:"Microsoft YaHei","PingFang SC",sans-serif;
      -webkit-font-smoothing:antialiased;
      color:#213027;
    }
    .farewell{
      width:100vw;height:100vh;
      display:flex;flex-direction:column;
      justify-content:center;align-items:center;
      text-align:center;
      padding:0 24px;
    }
    .farewell .l1{
      font-size:2.8rem;
      font-weight:600;
      line-height:1.8;
      letter-spacing:.06em;
    }
    .farewell .l2{
      font-size:3.8rem;
      font-weight:700;
      line-height:1.6;
      letter-spacing:.08em;
      color:#1a6b42;
    }
    @media(max-width:600px){
      .farewell .l1{font-size:2rem}
      .farewell .l2{font-size:2.6rem}
    }
  </style>
</head>
<body>
  <div class="farewell">
    <p class="l1">谢谢你还记得这个网页</p>
    <p class="l2">祝你以后开心轻松快乐！</p>
  </div>
</body>
</html>
